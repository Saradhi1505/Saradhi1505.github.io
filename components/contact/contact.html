
<section id="contact">
  <div class="container fade-in">
    <div class="contact-container">
      <h2 class="section-title">Let’s Build Something <span>Interesting</span></h2>
      <p>I'm always open to discussing new projects, creative ideas or opportunities to be part of your visions.</p>
      
      <form class="contact-form" onsubmit="event.preventDefault();">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" required></textarea>
        <button type="submit" class="btn btn-primary magnetic" style="align-self: flex-start; margin-top: 1rem;">Send Message</button>
      </form>

      <div class="social-links">
        <a href="#" class="magnetic"><i class="fab fa-github"></i></a>
        <a href="#" class="magnetic"><i class="fab fa-linkedin-in"></i></a>
        <a href="mailto:contact@example.com" class="magnetic"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </div>
</section>
